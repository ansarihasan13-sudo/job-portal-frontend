<div class="container mt-5">

  <h2 class="mb-4 text-center fw-bold text-primary">
    Available Jobs
  </h2>

  <!-- Search -->

  <div class="row mb-4 justify-content-center">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control shadow-sm"
        placeholder="🔍 Search by title or location..."
        [(ngModel)]="searchKeyword"
        (keyup)="filterJobs()"
      >
    </div>
  </div>

  <!-- Loading -->

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Loading jobs...</p>
  </div>

  <!-- No Jobs -->

  <div *ngIf="!isLoading && jobs.length === 0" class="text-center">
    <p class="text-muted">No jobs available at the moment.</p>
  </div>

  <!-- Jobs Grid -->

  <div class="row">

    <div class="col-md-6 mb-4" *ngFor="let job of jobs">

      <div class="card shadow-lg border-0 h-100 job-card">

        <div class="card-body d-flex flex-column">

          <!-- Logo + Title -->

          <div class="d-flex align-items-center mb-3">

            <img
              [src]="job.logoUrl ? 'http://localhost:8080/' + job.logoUrl : 'assets/job.png'"
              width="50"
              height="50"
              class="me-3 rounded shadow-sm job-image"
            />

            <div>

              <h5 class="card-title mb-1 fw-semibold">
                {{ job.title }}
              </h5>

              <small class="text-muted">
                {{ job.employer?.name }}
              </small>

            </div>

          </div>

          <!-- Location -->

          <p class="mb-2">
            📍 <span class="fw-semibold">{{ job.location }}</span>
          </p>

          <!-- Salary -->

          <span class="badge bg-success mb-3 p-2 align-self-start">
            💰 {{ job.salary }}
          </span>

          <!-- Description -->

          <p class="text-muted flex-grow-1">
            {{ job.description }}
          </p>

          <!-- Apply Button -->

          <div
            class="mt-3"
            *ngIf="authService.getRole() === 'JOB_SEEKER'"
          >

            <button
              class="btn btn-primary w-100 fw-semibold"
              [disabled]="appliedJobs.includes(job.id)"
              (click)="apply(job.id)"
            >

              {{ appliedJobs.includes(job.id) ? 'Already Applied' : 'Apply Now' }}

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
